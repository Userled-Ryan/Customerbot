site_name: customerbot
site_description: A Slack-resident bot that turns customer-surfaced queries into structured tickets and drafts customer replies for the SE to send.
site_url: https://userled-ryan.github.io/Customerbot
repo_url: https://github.com/Userled-Ryan/Customerbot
repo_name: Userled-Ryan/Customerbot

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Slack integration: integrations/slack.md
  - Configuration: configuration.md
  - Commands: commands.md
  - Deployment: deployment.md
  - Specs:
      - Flow (customer-side): specs/se-ticketing-flow-v1.md
      - Min-spec (build): specs/customerbot-min-spec.md
      - Implementation plan: specs/implementation-plan.md
      - Smoke test: specs/smoke-test.md
