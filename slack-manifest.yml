display_information:
  name: UserledSupport
  description: Triages and tracks customer-surfaced queries for Solutions Engineering
  background_color: "#24292f"

features:
  bot_user:
    display_name: UserledSupport
    always_online: true
  slash_commands:
    - command: /log
      url: https://customerbot-userled.fly.dev/slack/events
      description: Open a ticket-intake form
      usage_hint: " "
      should_escape: false
    - command: /l
      url: https://customerbot-userled.fly.dev/slack/events
      description: Open a ticket-intake form (shortcut for /log)
      usage_hint: " "
      should_escape: false
    - command: /board
      url: https://customerbot-userled.fly.dev/slack/events
      description: Snapshot live tickets or articles (ephemeral)
      usage_hint: "[articles | tickets]"
      should_escape: false
  shortcuts:
    - name: Log ticket
      type: message
      callback_id: log_ticket_msg
      description: Open a ticket-intake form pre-linked to this thread

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:join
      - channels:read
      - channels:write.invites
      - chat:write
      - commands
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:write
      - mpim:history
      - reactions:read
      - reactions:write
      - usergroups:read
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    request_url: https://customerbot-userled.fly.dev/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: https://customerbot-userled.fly.dev/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
